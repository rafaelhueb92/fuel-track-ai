name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # 1️⃣ Run Unit Tests before PR can be merged
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt

      - name: Run Unit Tests
        run: |
          pytest app/test

  # 2️⃣ Deploy Infrastructure after PR is merged
  deploy:
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

  # 3️⃣ Install ArgoCD & Prometheus on EKS
  install_tools:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd || true
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          kubectl port-forward svc/argocd-server -n argocd 8080:443 &

      - name: Install Prometheus
        run: |
          kubectl create namespace monitoring || true
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm install prometheus prometheus-community/kube-prometheus-stack --namespace monitoring

  # 4️⃣ Sync ArgoCD Manifests
  sync_argocd:
    needs: install_tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Sync ArgoCD
        run: |
          kubectl apply -f k8s/

  # 5️⃣ Check destroy.txt and Destroy Infra if needed
  destroy:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Check destroy.txt
        id: check_destroy
        run: |
          DESTROY=$(cat destroy.txt)
          echo "Destroy flag: $DESTROY"
          echo "DESTROY=$DESTROY" >> $GITHUB_ENV

      - name: Terraform Destroy
        if: env.DESTROY == 'true'
        working-directory: terraform
        run: terraform destroy -auto-approve
