apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuel-api
  labels:
    app: fuel-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fuel-api
  template:
    metadata:
      labels:
        app: fuel-api
    spec:
      containers:
        - name: fuel-api
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/fuel-track-ai:latest
          ports:
            - containerPort: 5000
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: DYNAMODB_TABLE
              value: "tb_fuel_control"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
