apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fuel-track-ai
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/YOUR_GITHUB_REPO"
    path: "k8s" 
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
